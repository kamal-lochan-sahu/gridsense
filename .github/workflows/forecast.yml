name: Forecast

# Selects the best model per country, forecasts the next 24 h and publishes forecast.json as an
# asset of the GitHub release `forecast-data` (replaced on every run). The API downloads it from
# there. It is NOT a git branch: Vercel builds every pushed branch, so a data-only branch made
# Vercel deployments fail every run. Needs the repository secret ENTSOE_API_KEY.
on:
  schedule:
    - cron: "17 */3 * * *"
  push:
    branches: [main]
    paths:
      - "pipeline/**"
      - ".github/workflows/forecast.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forecast
  cancel-in-progress: false

jobs:
  forecast:
    name: Run pipeline and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Fetch previous forecast (fallback for countries that fail this run)
        run: |
          curl -fsSL "https://github.com/${GITHUB_REPOSITORY}/releases/download/forecast-data/forecast.json" \
            -o "$RUNNER_TEMP/previous.json" \
            || curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/data/forecast.json" \
            -o "$RUNNER_TEMP/previous.json" \
            || echo "No previous forecast yet"

      - name: Run pipeline
        env:
          ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
        run: |
          if [ -z "$ENTSOE_API_KEY" ]; then
            echo "::error::Repository secret ENTSOE_API_KEY is not set"
            exit 1
          fi
          python -m pipeline.run --out "$RUNNER_TEMP/forecast.json" --previous "$RUNNER_TEMP/previous.json"

      - name: Publish forecast.json to the forecast-data release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG=forecast-data
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "Forecast data (auto-updated)" \
              --notes "forecast.json is replaced by .github/workflows/forecast.yml on every run. Do not edit." \
              --latest=false
          fi
          gh release upload "$TAG" "$RUNNER_TEMP/forecast.json" --clobber
