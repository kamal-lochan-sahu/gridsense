name: Forecast

# Retrains/selects the model per country, forecasts the next 24 h and publishes forecast.json
# to the orphan `data` branch (force-pushed, so main's history stays clean). The API reads it from
# raw.githubusercontent.com. Needs the repository secret ENTSOE_API_KEY.
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forecast
  cancel-in-progress: false

jobs:
  forecast:
    name: Run pipeline and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Fetch previous forecast (fallback for countries that fail this run)
        run: |
          curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/data/forecast.json" \
            -o "$RUNNER_TEMP/previous.json" || echo "No previous forecast yet"

      - name: Run pipeline
        env:
          ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
        run: |
          if [ -z "$ENTSOE_API_KEY" ]; then
            echo "::error::Repository secret ENTSOE_API_KEY is not set"
            exit 1
          fi
          python -m pipeline.run --out "$RUNNER_TEMP/forecast.json" --previous "$RUNNER_TEMP/previous.json"

      - name: Publish to data branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/data-branch"
          cd "$RUNNER_TEMP/data-branch"
          cp "$RUNNER_TEMP/forecast.json" forecast.json
          printf '%s\n' "Generated by .github/workflows/forecast.yml. Force-pushed on every run; do not edit." > README.md
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "forecast $(date -u +%Y-%m-%dT%H:%MZ)"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$AUTH"
          git -c "http.extraheader=AUTHORIZATION: basic $AUTH" push --force origin data
